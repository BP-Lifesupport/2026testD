<script>

  {

    title: "[募集時の正しい説明 - ①] 空欄 [1]〜[2]",
    body: `1. 生命保険契約は生命保険会社と契約者との間でとりかわす約束ですが、この内容となるお互いの権利義務を規定しているのが <span class="blank-tag">[1]</span> です。\n2. 生命保険会社はあらかじめ一定の契約条件、内容を定めた保険種類ごとの <span class="blank-tag">[1]</span> を作成し、<span class="blank-tag">[2]</span> の認可を受けて、契約者間相互が公平に契約できるようにしています。`,
    wordBank: ["ア. 約款", "イ. 定款", "ウ. 法務大臣", "エ. 内閣総理大臣"],

    wordBank: ["ア. 契約概要", "イ. 意向確認書面", "ウ. いただいた後で", "エ. いただく前に", "オ. 適合性の原則", "カ. 安全性の原則"],
    subQuestions: [
      { id: 3, points: 1, ans: "ア", ansLabel: "ア. 契約概要", exp: "商品の仕組みや保障内容などを記載した「契約概要」と、不利益事項等を記載した「注意喚起情報」を交付・説明します。" },

    wordBank: ["ア. 契約者", "イ. 生命保険募集人", "ウ. 内閣総理大臣", "エ. 都道府県", "オ. 特別の利益の提供", "カ. 告知義務違反"],
    subQuestions: [

    title: "[生命保険の募集等に関する法律 - ②] 空欄 [9]〜[10]",
    body: `「消費者契約法」では、事業者の不適切な勧誘方法によって、お客さまが誤認、または困惑して締結した契約については、その契約の申込み、またはその承諾の意思表示を取り消すことができると定めています。この場合、取り消しができるのは、原則として、お客さまが誤認に気がついたときや困惑の状況から解放されたときから <span class="blank-tag">[9]</span> 以内で、契約締結時から <span class="blank-tag">[10]</span> 以内となります。`,
    wordBank: ["ア. 1年", "イ. 2年", "ウ. 3年", "エ. 5年"],
    subQuestions: [
      { id: 9, points: 1, ans: "ア", ansLabel: "ア. 1年", exp: "消費者契約法による取消権の行使期間は、追認できる時（誤認に気づいた時等）から「1年」以内です。" },

    body: "損害保険は、物に関する保険の他、[  ] や傷害保険のように人に関する保険や、自動車保険の対人賠償保険のように賠償責任に関する保険もあります。",
    options: [
      { key: "ア", text: "ア. 所得補償保険" },
      { key: "イ", text: "イ. 火災保険" }
    ],
    ans: "ア",
    exp: "【正解：ア. 所得補償保険】人に関する損害保険の代表例は「所得補償保険」や傷害保険です（火災保険は物に関する保険）。"
  }
];

function renderQuiz() {
  const container = document.getElementById("quizContainer");
  container.innerHTML = "";

  quizData.forEach((item, idx) => {
    if (item.section) {
      const secDiv = document.createElement("div");
      secDiv.className = "section-header";
      secDiv.textContent = item.section;
      container.appendChild(secDiv);
    }

    const card = document.createElement("div");
    card.className = "question-card";

    if (item.type === "fill_group") {
      let html = `<div class="q-title">${item.title}</div>`;
      html += `<div class="q-body">${item.body}</div>`;
      html += `<div class="word-bank"><div class="word-bank-title">【語群】</div><div class="word-bank-items">${item.wordBank.map(w => `<span>${w}</span>`).join("")}</div></div>`;

      item.subQuestions.forEach(sq => {
        html += `
          <div class="sub-q-row">
            <div class="sub-q-header">
              <span class="sub-q-label">問題 ${sq.id}（${sq.points}点）</span>
              <select class="blank-select" id="input_q_${sq.id}">
                <option value="">-- 選択してください --</option>
                ${item.wordBank.map(w => {
                  const key = w.split(".")[0].trim();
                  return `<option value="${key}">${w}</option>`;
                }).join("")}
              </select>
              <span class="judge-badge" id="badge_q_${sq.id}"></span>
            </div>
            <div class="explanation-box" id="exp_q_${sq.id}">
              <div class="ans-text">正解：${sq.ansLabel}</div>
              <div>${sq.exp}</div>
            </div>
          </div>
        `;
      });
      card.innerHTML = html;
    } else if (item.type === "multi2") {
      let html = `<div class="q-title">${item.title}（${item.points}点：2つ選択） <span class="judge-badge" id="badge_q_${item.id}"></span></div>`;
      html += `<div class="q-body">${item.body}</div>`;
      html += `<div class="options-list">`;
      item.options.forEach(opt => {
        html += `
          <label class="opt-label">
            <input type="checkbox" name="q_${item.id}" value="${opt.key}" onchange="limitTwo(this, 'q_${item.id}')">
            <span>${opt.text}</span>
          </label>
        `;
      });
      html += `</div>`;
      html += `<div class="explanation-box" id="exp_q_${item.id}" style="white-space:pre-wrap;">${item.exp}</div>`;
      card.innerHTML = html;
    } else if (item.type === "single") {
      let html = `<div class="q-title">${item.title}（${item.points}点） <span class="judge-badge" id="badge_q_${item.id}"></span></div>`;
      html += `<div class="q-body">${item.body}</div>`;
      html += `<div class="options-list">`;
      item.options.forEach(opt => {
        html += `
          <label class="opt-label">
            <input type="radio" name="q_${item.id}" value="${opt.key}">
            <span>${opt.text}</span>
          </label>
        `;
      });
      html += `</div>`;
      html += `<div class="explanation-box" id="exp_q_${item.id}">${item.exp}</div>`;
      card.innerHTML = html;
    } else if (item.type === "tf") {
      let html = `<div class="q-title">${item.title}（${item.points}点） <span class="judge-badge" id="badge_q_${item.id}"></span></div>`;
      html += `<div class="q-body">${item.body}</div>`;
      html += `<div class="options-list horizontal">`;
      ["正", "誤"].forEach(val => {
        html += `
          <label class="opt-label" style="min-width:110px; justify-content:center;">
            <input type="radio" name="q_${item.id}" value="${val}">
            <span>${val}</span>
          </label>
        `;
      });
      html += `</div>`;
      html += `<div class="explanation-box" id="exp_q_${item.id}">${item.exp}</div>`;
      card.innerHTML = html;
    }

    container.appendChild(card);
  });
}

function limitTwo(checkbox, name) {
  const checked = document.querySelectorAll(`input[name="${name}"]:checked`);
  if (checked.length > 2) {
    checkbox.checked = false;
    alert("誤っているものを「2つ」まで選択してください。");
  }
}

function gradeQuiz() {
  let earned = 0;
  const maxScore = 100;

  quizData.forEach(item => {
    if (item.type === "fill_group") {
      item.subQuestions.forEach(sq => {
        const sel = document.getElementById(`input_q_${sq.id}`);
        const badge = document.getElementById(`badge_q_${sq.id}`);
        const exp = document.getElementById(`exp_q_${sq.id}`);
        const userVal = sel ? sel.value : "";

        badge.className = "judge-badge";
        exp.className = "explanation-box show";

        if (userVal === sq.ans) {
          earned += sq.points;
          badge.textContent = "正解（◯）";
          badge.classList.add("ok");
          exp.classList.add("ok");
        } else {
          badge.textContent = userVal ? `不正解（×） あなたの回答: ${userVal}` : "不正解（×） 未回答";
          badge.classList.add("ng");
          exp.classList.add("ng");
        }
      });
    } else if (item.type === "multi2") {
      const checked = Array.from(document.querySelectorAll(`input[name="q_${item.id}"]:checked`)).map(el => el.value);
      const badge = document.getElementById(`badge_q_${item.id}`);
      const exp = document.getElementById(`exp_q_${item.id}`);

      badge.className = "judge-badge";
      exp.className = "explanation-box show";

      let matchCount = 0;
      checked.forEach(v => {
        if (item.ans.includes(v)) matchCount++;
      });

      if (checked.length === 2 && matchCount === 2) {
        earned += 4;
        badge.textContent = "正解（◯） +4点";
        badge.classList.add("ok");
        exp.classList.add("ok");
      } else if (matchCount === 1 && checked.length <= 2) {
        earned += 2;
        badge.textContent = `部分点（△） +2点 あなたの回答: ${checked.join("・")}`;
        badge.classList.add("partial");
        exp.classList.add("partial");
      } else {
        badge.textContent = checked.length ? `不正解（×） あなたの回答: ${checked.join("・")}` : "不正解（×） 未回答";
        badge.classList.add("ng");
        exp.classList.add("ng");
      }
    } else if (item.type === "single" || item.type === "tf") {
      const checked = document.querySelector(`input[name="q_${item.id}"]:checked`);
      const userVal = checked ? checked.value : "";
      const badge = document.getElementById(`badge_q_${item.id}`);
      const exp = document.getElementById(`exp_q_${item.id}`);

      badge.className = "judge-badge";
      exp.className = "explanation-box show";

      if (userVal === item.ans) {
        earned += item.points;
        badge.textContent = "正解（◯）";
        badge.classList.add("ok");
        exp.classList.add("ok");
      } else {
        badge.textContent = userVal ? `不正解（×） あなたの回答: ${userVal}` : "不正解（×） 未回答";
        badge.classList.add("ng");
        exp.classList.add("ng");
      }
    }
  });

  const rate = ((earned / maxScore) * 100).toFixed(1);
  const banner = document.getElementById("resultBanner");
  document.getElementById("scoreMain").textContent = `${earned} / ${maxScore} 点`;
  document.getElementById("scoreSub").textContent = `正答率: ${rate}%`;

  const passBadge = document.getElementById("passBadge");
  if (earned >= 70) {
    passBadge.textContent = "合格ライン達成！（70点以上）";
    passBadge.className = "pass-badge pass";
  } else {
    passBadge.textContent = `合格ラインまであと ${70 - earned} 点`;
    passBadge.className = "pass-badge fail";
  }

  banner.classList.add("show");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetQuiz() {
  document.querySelectorAll("select.blank-select").forEach(el => el.value = "");
  document.querySelectorAll("input[type='radio'], input[type='checkbox']").forEach(el => el.checked = false);
  document.querySelectorAll(".judge-badge").forEach(el => {
    el.className = "judge-badge";
    el.textContent = "";
  });
  document.querySelectorAll(".explanation-box").forEach(el => {
    el.className = "explanation-box";
  });
  document.getElementById("resultBanner").classList.remove("show");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

renderQuiz();
</script>
</body>
</html>
